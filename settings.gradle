pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TerrainControl'

// common: the generator itself, free of Minecraft; platforms:neoforge: the mod for Minecraft 26.3.
// The 1.12.2 Forge code waits in legacy/forge and is not part of this build; it is ported into platforms/neoforge piece by piece.
include 'common', 'platforms:neoforge'
