// The core of TerrainControl: terrain, biomes, resources, custom objects and their configs, free of Minecraft

plugins {
    id 'java-library'
}

base {
    archivesName = 'terraincontrol-common'
}

description = 'Core files of TerrainControl'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
